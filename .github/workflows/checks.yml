name: Checks

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test runtime
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Run all Lua suites
        run: lua5.4 tests/run.lua
      - name: Build and verify release ZIP
        run: |
          python3 scripts/build_release.py /tmp/plainui.koplugin.zip
          python3 tests/check_release.py /tmp/plainui.koplugin.zip
