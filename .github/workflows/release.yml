name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to upload the release asset to
        required: true

permissions:
  contents: write

jobs:
  package:
    name: Package plugin
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Install test runtime
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Run all Lua suites
        run: lua5.4 tests/run.lua

      - name: Verify release tag
        env:
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          test "${TAG_NAME#v}" = "$version"

      - name: Build and verify release zip
        run: |
          python3 scripts/build_release.py plainui.koplugin.zip
          python3 tests/check_release.py plainui.koplugin.zip

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG_NAME" plainui.koplugin.zip --clobber
